      responses:
        '201':
          description: Funds source added
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/FundsSource' }

  /crm/leads/{id}/funds-sources/{fundsSourceId}:
    delete:
      tags: [CRM]
      summary: Remove a funds-source row
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: fundsSourceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: Removed

  /crm/leads/{id}/follow-ups:
    post:
      tags: [CRM]
      summary: Add a follow-up (SOW 5.11) — distinct from a generic Task
      security: [{ crmBearer: [] }]
