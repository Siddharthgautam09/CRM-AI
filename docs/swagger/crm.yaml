      tags: [CRM]
      summary: 'Permanently delete a contact (SOW 14.7) — recorded on the activity log'
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: Deleted

  /crm/team/contacts:
    get:
      tags: [CRM — Team Lead]
      summary: Every contact across the team's brokers
      security: [{ crmBearer: [] }]
      responses:
        '200':
          description: Contacts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: '#/components/schemas/Contact' } }

