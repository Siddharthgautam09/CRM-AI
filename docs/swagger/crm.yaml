        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, scheduledAt]
              properties:
                type: { type: string }
                scheduledAt: { type: string, format: date-time }
      responses:
        '201':
          description: Follow-up added
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/FollowUp' }

  /crm/leads/{id}/follow-ups/{followUpId}:
    delete:
      tags: [CRM]
      summary: Remove a follow-up
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: followUpId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: Removed

  /crm/leads/{id}/panel:
    get:
      tags: [CRM]
      summary: 'Person panel — Profile, Mortgages, Notes, Activity aggregated in one read'
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The panel
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/PersonPanel' }
        '403':
          description: "You don't have access to this record"
        '404':
          description: Not found

  /crm/leads/{id}/affordability:
    get:
      tags: [CRM]
      summary: Affordability tab
      description: >
        Always computed live from whatever's on the lead right now — see
        AffordabilityResult.missingFields for "add income and debts to
        calculate."
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The calculation (or which fields are missing)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Affordability' }

  /crm/leads/affordability/recalculate:
    post:
      tags: [CRM]
      summary: Recalculate everyone — across the caller's own book
      description: >
        Pass leadIds to retry just the previous failures instead of the
        whole book.
      security: [{ crmBearer: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                leadIds: { type: array, items: { type: string, format: uuid } }
      responses:
        '200':
          description: Progress summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/RecalculateSummary' }

  /crm/leads/{id}/notes:
    patch:
      tags: [CRM]
      summary: 'Update "Your notes" — editable, unlike the original'
      description: Every edit is appended to the activity log (the Notes tab's "History").
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [brokerNotes]
              properties:
                brokerNotes: { type: string }
      responses:
        '200':
          description: Updated
        '403':
          description: "You don't have access to this record"
        '404':
          description: Not found

  /crm/leads/{id}/tags:
    patch:
      tags: [CRM]
      summary: Replace the tag list
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tags]
              properties:
                tags: { type: array, items: { type: string } }
      responses:
        '200':
          description: Updated

  /crm/leads/{id}/profile:
    patch:
      tags: [CRM]
      summary: 'Inline profile edit (SOW 6.9) — "Save"; not calling this is "Cancel"'
      description: >
        For the header/profile-tab fields that don't already have their own
        endpoint — notes, tags, stage and the sensitive fields are edited
        elsewhere.
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                city: { type: string }
                fileStatus: { type: string, enum: [ACTIVE, INACTIVE] }
                propertyAddress: { type: string }
                propertyValue: { type: number }
                income: { type: number }
                monthlyDebts: { type: number }
                downPayment: { type: number }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Lead' }

  /crm/leads/{id}/reveal:
    post:
      tags: [CRM]
      summary: 'Reveal a hidden value — SIN, bank details, or date of birth'
      description: >
        The reveal itself is recorded on the activity log. Re-hiding on
        navigate-away is a frontend concern, not tracked here.
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [field]
              properties:
                field: { type: string, enum: [sin, bankDetails, dateOfBirth] }
      responses:
        '200':
          description: The decrypted value (or null if nothing is on file)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      field: { type: string }
                      value: { type: string, nullable: true }
        '403':
          description: "You don't have access to this record"
        '404':
          description: Not found

  /crm/tasks:
    post:
      tags: [CRM]
      summary: Add a task
      security: [{ crmBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTaskRequest' }
      responses:
        '201':
          description: Task created
    get:
      tags: [CRM]
      summary: My own tasks
      security: [{ crmBearer: [] }]
      responses:
        '200':
          description: The caller's tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Task' }

  /crm/tasks/{id}/complete:
    patch:
      tags: [CRM]
      summary: Tick a task complete
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Completed
        '404':
          description: Not found

  /crm/team/dashboard:
    get:
      tags: [CRM — Team Lead]
      summary: 'Team dashboard — pipeline · overdue tasks · workload'
      description: Team Lead only.
      security: [{ crmBearer: [] }]
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/TeamDashboard' }
        '403':
          description: Caller is not a Team Lead, or has no team yet

  /crm/team/book:
    get:
      tags: [CRM — Team Lead]
      summary: 'Team book — every lead/client across the team'
      security: [{ crmBearer: [] }]
      responses:
        '200':
          description: Every lead belonging to any broker on the team
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Lead' }

  /crm/team/book/{id}:
    get:
      tags: [CRM — Team Lead]
      summary: Open any lead in the team
      description: Same access a broker would get. Blocked (403) for a lead outside the caller's team.
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The lead
        '403':
          description: "You don't have access to this record — outside this team"

  /crm/team/book/{id}/panel:
    get:
      tags: [CRM — Team Lead]
      summary: Person panel for any lead in the team
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The panel
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/PersonPanel' }
        '403':
          description: "You don't have access to this record — outside this team"

  /crm/team/book/{id}/affordability:
    get:
      tags: [CRM — Team Lead]
      summary: Affordability tab for any lead in the team
      security: [{ crmBearer: [] }]
