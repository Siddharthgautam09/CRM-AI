components:
  securitySchemes:
    crmBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        A Broker or Team Lead access token from modules/auth's
        POST /api/v1/modauth/login. The caller's Role/team is resolved
        server-side via modules/auth's internal lookup, not a JWT claim.
  schemas:
    Applicant:
      type: object
      description: 'SOW 5.1/5.3 — one to four per lead.'
      properties:
        id: { type: string, format: uuid }
        leadId: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, nullable: true }
        address: { type: string, nullable: true }
        dateOfBirth: { type: string, format: date-time, nullable: true }
        brokerNotes: { type: string, nullable: true }
    Employment:
      type: object
      description: 'SOW 5.4/5.5/5.6 — one of possibly several jobs for an applicant.'
      properties:
        id: { type: string, format: uuid }
        applicantId: { type: string, format: uuid }
        type: { type: string, enum: [EMPLOYED, SELF_EMPLOYED, CORPORATION] }
        employer: { type: string, nullable: true }
        position: { type: string, nullable: true }
        startDate: { type: string, format: date-time, nullable: true }
        baseSalary: { type: number, nullable: true }
        t4Values:
          type: object
          nullable: true
          description: "{'2024': 95000, '2023': 91000} — a map, not fixed columns."
          additionalProperties: { type: number }
    NoaIncome:
      type: object
      description: 'SOW 5.7 — Notice of Assessment line 15000, one row per tax year.'
      properties:
        id: { type: string, format: uuid }
        applicantId: { type: string, format: uuid }
        taxYear: { type: integer }
        totalIncome: { type: number }
    Debt:
      type: object
      properties:
        id: { type: string, format: uuid }
        leadId: { type: string, format: uuid }
        description: { type: string, nullable: true }
        balance: { type: number }
        monthlyPayment: { type: number }
    PropertyRecord:
      type: object
      description: 'SOW 5.9 — a property already owned, distinct from the Lead.propertyAddress being purchased.'
      properties:
        id: { type: string, format: uuid }
        leadId: { type: string, format: uuid }
        address: { type: string }
        propertyTaxes: { type: number, nullable: true }
        isCondo: { type: boolean }
        isRental: { type: boolean }
        mortgageBalance: { type: number, nullable: true }
        mortgageLender: { type: string, nullable: true }
        maturityDate: { type: string, format: date-time, nullable: true }
        ownership: { type: string, nullable: true }
    FundsSource:
      type: object
      description: 'SOW 5.10 — a repeatable down-payment funds-source row.'
      properties:
        id: { type: string, format: uuid }
        leadId: { type: string, format: uuid }
        accountType: { type: string }
        amount: { type: number }
        isGift: { type: boolean }
        giftSource: { type: string, nullable: true }
    FollowUp:
      type: object
      description: 'SOW 5.11 — a scheduled commitment from the intake, distinct from a generic Task.'
      properties:
        id: { type: string, format: uuid }
        leadId: { type: string, format: uuid }
        type: { type: string }
        scheduledAt: { type: string, format: date-time }
    IntakeBundle:
      type: object
      description: 'The full structured intake for one lead — GET /crm/leads/{id}/intake.'
      properties:
        applicants:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Applicant'
              - type: object
                properties:
                  employments: { type: array, items: { $ref: '#/components/schemas/Employment' } }
                  noaIncomes: { type: array, items: { $ref: '#/components/schemas/NoaIncome' } }
        debts: { type: array, items: { $ref: '#/components/schemas/Debt' } }
        properties: { type: array, items: { $ref: '#/components/schemas/PropertyRecord' } }
        fundsSources: { type: array, items: { $ref: '#/components/schemas/FundsSource' } }
        followUps: { type: array, items: { $ref: '#/components/schemas/FollowUp' } }
    Contact:
      type: object
      description: "SOW Module 14 — the broker's own referral network (Centre of Influence)."
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        brokerUserId: { type: string, format: uuid }
        category:
          type: string
          enum:
            [REALTOR, LAWYER, APPRAISER, INSURANCE, ACCOUNTANT, HOME_INSPECTOR, FINANCIAL_ADVISOR]
        name: { type: string }
        company: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        dateOfBirth: { type: string, format: date-time, nullable: true }
        address: { type: string, nullable: true }
        city: { type: string, nullable: true }
        lastContactedAt: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Lead:
      type: object
      description: >
        Also "the client" once stage is FUNDED — there's no separate model,
        see /crm/clients.
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        brokerUserId: { type: string, format: uuid }
        name: { type: string, example: Jamie Rivera }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, nullable: true }
        stage:
          type: string
          enum: [NEW, QUALIFIED, APPLICATION, UNDERWRITING, APPROVED, FUNDED, LOST]
        lostReason: { type: string, nullable: true }
        income: { type: number, nullable: true }
        monthlyDebts: { type: number, nullable: true }
        downPayment: { type: number, nullable: true }
        propertyAddress: { type: string, nullable: true }
        propertyValue: { type: number, nullable: true }
        notes:
          {
            type: string,
            nullable: true,
            description: 'Original notes — locked forever as the source record.',
          }
        brokerNotes:
          {
            type: string,
            nullable: true,
            description: 'Your notes — editable. See /crm/leads/{id}/notes.',
          }
        tags: { type: array, items: { type: string } }
        dateOfBirth:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: 'Hidden — see /crm/leads/{id}/reveal.',
          }
        hasSin:
          type: boolean
          description: 'Whether a SIN is on file. The value itself is never returned here — see /crm/leads/{id}/reveal.'
        hasBankDetails:
          type: boolean
          description: 'Whether bank details are on file. The value itself is never returned here — see /crm/leads/{id}/reveal.'
        affordabilitySnapshot:
          type: object
          nullable: true
          description: 'Last "Recalculate everyone" result. The Affordability tab itself always computes live — see /crm/leads/{id}/affordability.'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateLeadRequest:
      type: object
      required: [name]
      description: >
        Flow 4.1's "New client" form — single-applicant scope (no
        co-applicant modeling). Voice notes / AI review aren't implemented;
        notes are taken as plain text.
      properties:
        name: { type: string, example: Jamie Rivera }
        email: { type: string, format: email }
        phone: { type: string }
        income: { type: number, example: 95000 }
        monthlyDebts: { type: number, example: 800 }
        downPayment: { type: number, example: 50000 }
        propertyAddress: { type: string }
        propertyValue: { type: number, example: 450000 }
        notes: { type: string }
        tags: { type: array, items: { type: string } }
        dateOfBirth: { type: string, format: date-time }
        sin:
          {
            type: string,
            description: 'Encrypted at rest (AES-256-GCM) — never returned by any read path except the reveal endpoint.',
          }
        bankDetails:
          {
            type: string,
            description: 'Encrypted at rest (AES-256-GCM) — never returned by any read path except the reveal endpoint.',
          }
        acceptedTasks:
          type: array
          description: 'Flow 4.2 "Save" — AI-review tasks the broker accepted; created with the lead in one transaction.'
          items:
            type: object
            required: [title]
            properties:
              title: { type: string }
              dueDate: { type: string, format: date-time }
        draftEmail:
          type: object
          description: 'Flow 4.2 — the accepted AI draft, saved (never sent) and marked AI-assisted.'
          required: [subject, body]
          properties:
            intent: { type: string }
            subject: { type: string }
            body: { type: string }
    Affordability:
      type: object
      description: 'Ratios, stress-tested rate and maximum purchase price (Flow 4.4) — always computed live, never cached for a single read.'
      properties:
        sufficientData: { type: boolean }
        missingFields:
          {
            type: array,
            items: { type: string },
            description: "e.g. ['income', 'monthlyDebts'] when there isn't enough to calculate.",
          }
        tds:
          {
            type: number,
            nullable: true,
            description: 'Total Debt Service ratio, %. Null if no propertyValue is set yet.',
          }
        stressTestRate:
          { type: number, description: 'max(contract rate + 2%, benchmark qualifying rate).' }
        maxPurchasePrice: { type: number, nullable: true }
        passing:
          {
            type: boolean,
            nullable: true,
            description: 'Null when there is no chosen property to test against.',
          }
        overBy:
          type: object
          nullable: true
          description: "Which figure caused a fail, e.g. { field: 'tds', excessPercent: 3.2 }."
          properties:
            field: { type: string }
            excessPercent: { type: number }
    RecalculateSummary:
      type: object
      description: "'Recalculate everyone' (Flow 4.4) — progress and partial failure, e.g. '38 of 41 updated'."
      properties:
        total: { type: integer }
        succeeded: { type: integer }
        failures:
          type: array
          items:
            type: object
            properties:
              leadId: { type: string, format: uuid }
              name: { type: string }
              reason: { type: string }
    PersonPanel:
      type: object
      description: 'Flow 4.3 — the same aggregated panel everywhere (dashboard, list, calendar, task, search).'
      properties:
        profile: { $ref: '#/components/schemas/Lead' }
        mortgages: { type: array, items: { $ref: '#/components/schemas/Mortgage' } }
        notes:
          type: object
          properties:
            original: { type: string, nullable: true, description: 'Read-only, locked forever.' }
            yours:
              { type: string, nullable: true, description: 'Editable — see /crm/leads/{id}/notes.' }
            history:
              {
                type: array,
                items: { type: object },
                description: 'Append-only — every edit to "yours", oldest first is not guaranteed; see createdAt.',
              }
        activity:
          {
            type: array,
            items: { type: object },
            description: 'Recent activity-log entries for this lead.',
          }
        documents:
          type: object
          description: 'Documents tab shell — always empty until document storage lands (SOW Module 8).'
          properties:
            items: { type: array, items: { type: object } }
            missing: { type: array, items: { type: string } }
    AiDraftEmail:
      type: object
      description: 'STUB — placeholder output until the AI team wires a model in.'
      properties:
        stub: { type: boolean, enum: [true] }
        disclosure: { type: string }
        intent:
          {
            type: string,
            enum: [FOLLOW_UP, RENEWAL, BIRTHDAY, DOCUMENTS, ANNUAL_REVIEW, REFINANCE],
          }
        subject: { type: string }
        body: { type: string }
    AiReview:
      type: object
      description: 'STUB (SOW 5.14–5.23) — fixed placeholder output; only missingFields reflects the real lead.'
      properties:
        stub: { type: boolean, enum: [true] }
        disclosure: { type: string }
        summary: { type: string }
        intent: { type: string }
        urgency: { type: string, enum: [LOW, MEDIUM, HIGH] }
        extractedFields: { type: object, additionalProperties: true }
        missingFields: { type: array, items: { type: string } }
        painPoints: { type: array, items: { type: string } }
        opportunities: { type: array, items: { type: string } }
        draftEmail: { $ref: '#/components/schemas/AiDraftEmail' }
        proposedTasks:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              dueInDays: { type: integer }
    Mortgage:
      type: object
      properties:
        id: { type: string, format: uuid }
        leadId: { type: string, format: uuid }
        lender: { type: string, example: Acme Bank }
        interestRate: { type: number, example: 4.5 }
        balance: { type: number, example: 300000 }
        monthlyPayment: { type: number, example: 1500 }
        maturityDate: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    MortgageRequest:
      type: object
      required: [lender, interestRate, balance, monthlyPayment, maturityDate]
      properties:
        lender: { type: string }
        interestRate: { type: number }
        balance: { type: number }
        monthlyPayment: { type: number }
        maturityDate: { type: string, format: date-time }
    Task:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        brokerUserId: { type: string, format: uuid }
        leadId: { type: string, format: uuid, nullable: true }
        title: { type: string }
        dueDate: { type: string, format: date-time, nullable: true }
        completed: { type: boolean }
        createdAt: { type: string, format: date-time }
    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }
        leadId: { type: string, format: uuid }
        dueDate: { type: string, format: date-time }
        priority: { type: string, enum: [LOW, MEDIUM, HIGH], default: MEDIUM }
    BrokerWorkload:
      type: object
      description: >
        One row per team member, including a broker with nothing assigned
        (shown at zero, never omitted).
      properties:
        brokerUserId: { type: string, format: uuid }
        brokerName: { type: string, nullable: true }
        openLeads: { type: integer }
        overdueTasks: { type: integer }
        renewalsWithin90Days:
          type: integer
          description: Mortgages on this broker's clients maturing within 90 days.
        missingDocuments:
          type: integer
          description: Always 0 — no per-lead Document model exists yet.
    TeamDashboard:
      type: object
      properties:
        pipeline:
          type: object
          description: Lead count per stage across the whole team.
          additionalProperties: { type: integer }
        overdueTasks: { type: integer, description: Sum across every team member. }
        workload:
          type: array
          items: { $ref: '#/components/schemas/BrokerWorkload' }

paths:
  /crm/leads:
    post:
      tags: [CRM]
      summary: New client
      security: [{ crmBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLeadRequest' }
      responses:
        '201':
          description: Lead created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Lead' }
    get:
      tags: [CRM]
      summary: "My leads — not yet funded and not lost (an Assistant sees their whole team's)"
      description: >
        Every broker-dashboard card opens one of these filtered lists — the
        dashboard response's links give the exact URL for each card.
      security: [{ crmBearer: [] }]
      parameters:
        - name: stage
          in: query
          description: 'Comma-separated stages (e.g. UNDERWRITING,APPROVED), or ALL for every stage. Default: the active pipeline.'
          schema: { type: string, example: UNDERWRITING }
        - {
            name: hot,
            in: query,
            schema: { type: boolean },
            description: 'Hot leads: Application, Underwriting or Approved',
          }
        - {
            name: renewalWithinDays,
            in: query,
            schema: { type: integer, minimum: 0 },
            description: 'Has a mortgage maturing within N days (renewals card: 180)',
          }
        - {
            name: followUpWithinDays,
            in: query,
            schema: { type: integer, minimum: 0 },
            description: 'Has a follow-up due within N days, overdue included (follow-ups card: 7)',
          }
        - {
            name: birthdayWithinDays,
            in: query,
            schema: { type: integer, minimum: 0 },
            description: 'Birthday within the next N days (birthdays card: 7)',
          }
        - {
            name: missingDocuments,
            in: query,
            schema: { type: boolean },
            description: 'Still missing a ticked document',
          }
      responses:
        '200':
          description: The caller's active pipeline
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Lead' }

  /crm/clients:
    get:
      tags: [CRM]
      summary: 'My clients — funded leads, with their mortgage(s)'
      security: [{ crmBearer: [] }]
      parameters:
        - {
            name: renewalWithinDays,
            in: query,
            schema: { type: integer, minimum: 0 },
            description: 'Has a mortgage maturing within N days (renewals card: 180)',
          }
        - {
            name: followUpWithinDays,
            in: query,
            schema: { type: integer, minimum: 0 },
            description: 'Has a follow-up due within N days, overdue included (follow-ups card: 7)',
          }
        - {
            name: birthdayWithinDays,
            in: query,
            schema: { type: integer, minimum: 0 },
            description: 'Birthday within the next N days (birthdays card: 7)',
          }
        - {
            name: missingDocuments,
            in: query,
            schema: { type: boolean },
            description: 'Still missing a ticked document',
          }
      responses:
        '200':
          description: The caller's funded clients
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Lead' }

  /crm/leads/{id}:
    get:
      tags: [CRM]
      summary: One of my own leads
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The lead
        '403':
          description: "You don't have access to this record"
        '404':
          description: Not found

    delete:
      tags: [CRM]
      summary: 'Delete this person permanently (Flow 4.11)'
      description: >
        Body must repeat the person's name exactly. Their tasks stay, marked unlinked. Recorded in the activity log. Broker/Team Lead only.
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmName]
              properties:
                confirmName: { type: string }
      responses:
        '204':
          description: 'Deleted'
        '400':
          description: 'Name did not match'
  /crm/leads/{id}/stage:
    patch:
      tags: [CRM]
      summary: Move a lead through the pipeline
      description: >
        A reason is required when moving to LOST. FUNDED is rejected here
        (400) — use POST /crm/leads/{id}/fund instead, since funding cannot
        be skipped without mortgage details.
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage]
              properties:
                stage:
                  {
                    type: string,
                    enum: [NEW, QUALIFIED, APPLICATION, UNDERWRITING, APPROVED, LOST],
                  }
                lostReason: { type: string, description: 'Required when moving to LOST' }
                lostNote: { type: string, description: 'Optional, only kept with LOST' }
      responses:
        '200':
          description: Updated
        '400':
          description: Missing lostReason when moving to LOST, or stage was FUNDED

  /crm/leads/{id}/fund:
    post:
      tags: [CRM]
      summary: 'Change the stage to Funded — cannot be skipped'
      description: >
        Creates the mortgage and moves the stage to FUNDED in one
        transaction — if either fails, the stage change is cancelled and
        the lead stays where it was. The lead then appears under
        /crm/clients instead of /crm/leads.
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MortgageRequest' }
      responses:
        '200':
          description: Funded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Lead' }
        '400':
          description: Missing mortgage details

  /crm/leads/{id}/mortgages:
    post:
      tags: [CRM]
      summary: 'Add another mortgage — a client can hold more than one'
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MortgageRequest' }
      responses:
        '201':
          description: Mortgage added
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Mortgage' }
        '400':
          description: The lead isn't funded yet

  /crm/leads/{id}/intake:
    get:
      tags: [CRM]
      summary: The full structured intake bundle (SOW Module 5)
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The bundle
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/IntakeBundle' }

  /crm/leads/{id}/applicants:
    post:
      tags: [CRM]
      summary: Add an applicant — at most 4 per lead
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName]
              properties:
                firstName: { type: string }
                lastName: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                address: { type: string }
                dateOfBirth: { type: string, format: date-time }
                brokerNotes: { type: string }
      responses:
        '201':
          description: Applicant added
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Applicant' }
        '400':
          description: A lead can have at most 4 applicants

  /crm/leads/{id}/applicants/{applicantId}:
    patch:
      tags: [CRM]
      summary: Update an applicant
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: applicantId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Updated
    delete:
      tags: [CRM]
      summary: Remove an applicant
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: applicantId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: Removed

  /crm/leads/{id}/applicants/{applicantId}/employment:
    post:
      tags: [CRM]
      summary: Add a job for this applicant — always adds, never replaces (SOW 5.5)
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: applicantId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
