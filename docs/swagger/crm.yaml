          description: Every lead in the tenant
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Lead' }

  /crm/tenant/export:
    post:
      tags: [Tenant Admin]
      summary: 'Export all our data — self-service, distinct from the Super Admin cancellation export'
      description: Packages the tenant's own leads/clients, their mortgages, and tasks.
      security: [{ crmBearer: [] }]
      responses:
        '201':
          description: Export job started
    get:
      tags: [Tenant Admin]
      summary: Latest export status
      security: [{ crmBearer: [] }]
      responses:
        '200':
          description: The latest export job, or null if none has been started

  /crm/tenant/export/{jobId}/download:
    get:
      tags: [Tenant Admin]
      summary: Download the export
      description: 403 if jobId isn't this tenant's current (latest) export.
      security: [{ crmBearer: [] }]
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The zip file
        '403':
          description: Not your brokerage's export
        '409':
          description: Export is not ready yet
        '410':
          description: Download window has expired

  /crm/integrations/google/connect:
    get:
      tags: [Google integration]
      summary: 'Connect email/calendar — the Google OAuth consent URL'
      description: Broker and Team Lead each connect their own Google account.
      security: [{ crmBearer: [] }]
      responses:
        '200':
          description: The URL to redirect the browser to
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: object, properties: { url: { type: string } } }

  /crm/integrations/google/callback:
    get:
      tags: [Google integration]
      summary: OAuth callback
      description: >
        Public — Google redirects the browser here directly with no JWT.
        `state` is the userId that started the connect flow.
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Connected
        '400':
          description: Unknown user for this connection attempt

  /crm/integrations/google/status:
    get:
      tags: [Google integration]
      summary: Is Google connected, and as which account?
      security: [{ crmBearer: [] }]
      responses:
        '200':
          description: '{ connected, googleEmail }'

  /crm/integrations/google:
    delete:
      tags: [Google integration]
      summary: Disconnect
      security: [{ crmBearer: [] }]
      responses:
        '204':
          description: Disconnected

  /crm/appointments:
    post:
      tags: [Google integration]
      summary: 'New appointment (Flow 4.8) — pushed to Google Calendar if connected, else CRM-only'
      security: [{ crmBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, startTime, endTime]
              properties:
                title: { type: string }
                type:
                  type: string
                  enum: [CALL, CONSULTATION, DOCUMENT_REVIEW]
                  default: CONSULTATION
                  description: 'Flow 4.8 — call · consultation · document review'
                startTime: { type: string, format: date-time }
                endTime: { type: string, format: date-time }
                leadId: { type: string, format: uuid }
                attendeeEmails: { type: array, items: { type: string, format: email } }
      responses:
        '201':
          description: Created — check pushedToGoogle to see whether it reached Calendar
    get:
      tags: [Google integration]
      summary: My appointments
      security: [{ crmBearer: [] }]
      parameters:
        - {
            name: from,
            in: query,
            schema: { type: string, format: date-time },
            description: 'Starts at or after',
          }
        - {
            name: to,
            in: query,
            schema: { type: string, format: date-time },
            description: 'Starts before',
          }
      responses:
        '200':
          description: The caller's appointments

  /crm/team/calendar:
    get:
      tags: [CRM — Team Lead]
      summary: Team calendar — every appointment across the team's brokers
      security: [{ crmBearer: [] }]
      responses:
        '200':
          description: Team appointments

  /crm/emails/send:
    post:
      tags: [Google integration]
      summary: 'Sending an email (Flow 4.7)'
      description: 400 ("Connect Gmail to send") if the broker hasn't connected Google yet.
      security: [{ crmBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, subject, body]
              properties:
                to: { type: string, format: email }
                subject: { type: string }
                body: { type: string }
                leadId: { type: string, format: uuid }
      responses:
        '204':
          description: Sent — logged on the person's timeline (activity log)
        '400':
          description: Connect Gmail to send

  /crm/contacts:
    post:
      tags: [CRM]
      summary: Add a contact (SOW Module 14) — one of 7 fixed categories
      security: [{ crmBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, name]
              properties:
                category:
                  type: string
                  enum:
                    [
                      REALTOR,
                      LAWYER,
                      APPRAISER,
                      INSURANCE,
                      ACCOUNTANT,
                      HOME_INSPECTOR,
                      FINANCIAL_ADVISOR,
                    ]
                name: { type: string }
                company: { type: string }
                phone: { type: string }
                email: { type: string, format: email }
                dateOfBirth: { type: string, format: date-time }
                address: { type: string }
                city: { type: string }
                lastContactedAt: { type: string, format: date-time }
                notes: { type: string }
      responses:
        '201':
          description: Contact added
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Contact' }
    get:
      tags: [CRM]
      summary: 'List my contacts — search by name/company/email/phone (SOW 14.3), optionally filtered by category (14.4)'
      security: [{ crmBearer: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - name: category
          in: query
          schema:
            type: string
            enum:
              [REALTOR, LAWYER, APPRAISER, INSURANCE, ACCOUNTANT, HOME_INSPECTOR, FINANCIAL_ADVISOR]
      responses:
        '200':
          description: Contacts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: '#/components/schemas/Contact' } }

  /crm/contacts/category-counts:
    get:
      tags: [CRM]
      summary: Contact count per category (SOW 14.4) — all 7 shown, zero-filled when empty
      security: [{ crmBearer: [] }]
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    additionalProperties: { type: integer }

  /crm/contacts/{id}:
    patch:
      tags: [CRM]
      summary: Update a contact
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Updated
    delete:
      tags: [CRM]
      summary: 'Permanently delete a contact (SOW 14.7) — recorded on the activity log'
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: Deleted

  /crm/team/contacts:
    get:
      tags: [CRM — Team Lead]
      summary: Every contact across the team's brokers
      security: [{ crmBearer: [] }]
      responses:
        '200':
          description: Contacts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: '#/components/schemas/Contact' } }

  /crm/voice-notes:
    post:
      summary: 'Voice note → transcript (Flow 4.1) — transcription is a STUB'
      description: >
        Send the audio as the raw request body (audio/*, up to 10MB). The
        recording is always kept (30 days). If AI is switched off or the daily
        allowance is used up you still get 201 with transcribed false and the
        reason — retry later with /crm/voice-notes/{id}/transcribe, or type the notes.
      security: [{ crmBearer: [] }]
      requestBody:
        required: true
        content:
          audio/webm:
            schema: { type: string, format: binary }
          audio/mpeg:
            schema: { type: string, format: binary }
          audio/mp4:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: '{ voiceNoteId, transcribed, transcript, reason? }'
          content:
            application/json:
              example:
                success: true
                data:
                  {
                    voiceNoteId: 3f1c…,
                    transcribed: true,
                    transcript: '[Placeholder transcript]',
                    stub: true,
                  }

  /crm/voice-notes/{id}/transcribe:
    post:
      summary: 'Retry transcribing a saved voice note — STUB'
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: '{ voiceNoteId, transcribed, transcript, reason? }' }

  /crm/ai/review-notes:
    post:
      tags: [CRM]
      summary: 'Analyse notes before saving (Flow 4.1 → 4.2) — STUB'
      description: >
        Stateless: nothing is created, so Discard needs no call. Save = POST /crm/leads with acceptedTasks and draftEmail.
      security: [{ crmBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [notes]
              properties:
                name: { type: string }
                notes: { type: string }
                fields:
                  {
                    type: object,
                    description: 'What is already typed into the form — only used to report what is missing.',
                  }
      responses:
        '200':
          description: 'AiReview'
        '403':
          description: 'AI switched off in settings'
        '429':
          description: 'Daily AI allowance used up'

  /crm/ai/assistant:
    post:
      tags: [CRM]
      summary: 'AI Assistant (Flow 4.10) — STUB, read-only'
      description: >
        Answers only from records the caller may see (own book; a Team Lead sees the team). It cannot create, change, send or delete.
      security: [{ crmBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string }
      responses:
        '200':
          description: '{ stub, readOnly: true, answer, records: [{ leadId, name }] }'
        '429':
          description: 'Daily AI allowance used up — resets at midnight UTC'

  /crm/leads/{id}/ai/suggest-tasks:
    post:
      tags: [CRM]
      summary: 'Suggest follow-up tasks (Flow 4.9) — STUB'
      description: >
        Stored as suggested tasks for the lead's broker, who approves or dismisses them.
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201':
          description: 'The suggested tasks'

  /crm/leads/{id}/email-drafts:
    post:
      tags: [CRM]
      summary: 'Save an email draft — nothing is sent (Flow 4.7)'
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, body]
              properties:
                intent:
                  {
                    type: string,
                    enum: [FOLLOW_UP, RENEWAL, BIRTHDAY, DOCUMENTS, ANNUAL_REVIEW, REFINANCE],
                  }
                subject: { type: string }
                body: { type: string }
                aiAssisted: { type: boolean }
      responses:
        '201':
          description: 'Draft saved'
    get:
      tags: [CRM]
      summary: "This person's saved drafts"
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 'OK'

  /crm/email-drafts/{draftId}:
    patch:
      tags: [CRM]
      summary: 'Edit a saved draft'
      security: [{ crmBearer: [] }]
      parameters:
        - { name: draftId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                intent: { type: string }
                subject: { type: string }
                body: { type: string }
      responses:
        '200':
          description: 'OK'

  /crm/settings:
    get:
      tags: [CRM]
      summary: 'My CRM settings (Flow 4.12)'
      security: [{ crmBearer: [] }]
      responses:
        '200':
          description: '{ aiEnabled }'
    patch:
      tags: [CRM]
      summary: 'AI features on or off (Flow 4.12)'
      description: >
        Switched off, every AI endpoint returns 403 and the frontend hides its buttons.
      security: [{ crmBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [aiEnabled]
              properties:
                aiEnabled: { type: boolean }
      responses:
        '200':
          description: 'OK'

  /crm/tasks/{id}/approve:
    patch:
      tags: [CRM]
      summary: 'Approve a suggested task — it becomes a real task (Flow 4.9)'
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 'OK'
        '409':
          description: 'Not a suggested task'

  /crm/tasks/{id}:
    delete:
      tags: [CRM]
      summary: 'Dismiss a suggested task, or delete an unlinked one (Flow 4.9)'
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: 'Deleted'
        '409':
          description: 'A real, linked task is completed, not deleted'

  /crm/tasks/{id}/link:
    patch:
      tags: [CRM]
      summary: 'Reassign an unlinked task to another person (Flow 4.9)'
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leadId]
              properties:
                leadId: { type: string, format: uuid }
      responses:
        '200':
          description: 'OK'

  /crm/dashboard:
    get:
      tags: [CRM]
      summary: 'Broker dashboard (Flow 4)'
      description: >
        Hot leads, pipeline, portfolio value, renewals, today's meetings, follow-ups, birthdays, tasks due/overdue, missing documents; AI suggestions and refinance opportunities are stubs (empty). Every card is clickable — links holds the filtered list URL each card opens (relative to the API prefix), e.g. links.pipeline.UNDERWRITING = /crm/leads?stage=UNDERWRITING.
      security: [{ crmBearer: [] }]
      responses:
        '200':
          description: 'OK'

  /crm/search:
    get:
      tags: [CRM]
      summary: "Search the caller's book → person panel"
      security: [{ crmBearer: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: 'OK'

  /crm/notifications:
    get:
      tags: [CRM]
      summary: 'My notifications — reminders, digest, "broker notified" events'
      security: [{ crmBearer: [] }]
      responses:
        '200':
          description: 'OK'

  /crm/notifications/{id}/read:
    patch:
      tags: [CRM]
      summary: 'Mark a notification read'
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 'OK'

  /crm/leads/{id}/documents:
    get:
      tags: [CRM]
      summary: 'Documents tab — received, ticked, missing (Flow 4.5)'
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 'OK'
    post:
      tags: [CRM]
      summary: 'Upload a file yourself (Flow 4.5)'
      description: >
        Raw file as the request body. Virus check (stub) → stored → read (OCR stub) → broker reviews the values.
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - {
            name: type,
            in: query,
            required: true,
            schema:
              {
                type: string,
                enum:
                  [
                    ID,
                    T4,
                    NOA,
                    PAY_STUB,
                    EMPLOYMENT_LETTER,
                    BANK_STATEMENT,
                    PURCHASE_AGREEMENT,
                    MORTGAGE_STATEMENT,
                    PROPERTY_TAX,
                    OTHER,
                  ],
              },
          }
        - { name: fileName, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: 'Stored'
        '413':
          description: 'Too large'
        '422':
          description: 'Failed the virus check — not stored'

  /crm/leads/{id}/documents/required:
    put:
      tags: [CRM]
      summary: 'Tick which documents this person needs to send'
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [types]
              properties:
                types:
                  {
                    type: array,
                    items:
                      {
                        type: string,
                        enum:
                          [
                            ID,
                            T4,
                            NOA,
                            PAY_STUB,
                            EMPLOYMENT_LETTER,
                            BANK_STATEMENT,
                            PURCHASE_AGREEMENT,
                            MORTGAGE_STATEMENT,
                            PROPERTY_TAX,
                            OTHER,
                          ],
                      },
                  }
      responses:
        '200':
          description: 'OK'

  /crm/leads/{id}/documents/request:
    post:
      tags: [CRM]
      summary: 'Request documents — email a 7-day link (Flow 4.5)'
      description: >
        From the broker's connected inbox; 409 if not connected unless useSystemAddress is true (system mail is a stub). Calling again generates a new link.
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                useSystemAddress: { type: boolean }
      responses:
        '201':
          description: '{ url, expiresAt, sentVia, missing }'
        '409':
          description: 'Connect your email, or send from the system address'

  /crm/documents/{documentId}/apply:
    post:
      tags: [CRM]
      summary: 'Accept extracted values — fills blank fields only'
      security: [{ crmBearer: [] }]
      parameters:
        - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fields]
              properties:
                fields: { type: object }
      responses:
        '200':
          description: 'OK'

  /crm/documents/{documentId}/download:
    get:
      tags: [CRM]
      summary: 'Download a document (recorded in the activity log)'
      security: [{ crmBearer: [] }]
      parameters:
        - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 'OK'

  /crm/tenant/dashboard:
    get:
      tags: [CRM]
      summary: 'Brokerage dashboard (Flow 2)'
      description: >
        403 until the brokerage profile is complete (Flow 0).
      security: [{ crmBearer: [] }]
      responses:
        '200':
          description: 'OK'

  /crm/tenant/people/{userId}/reassign-clients:
    post:
      tags: [CRM]
      summary: "Reassign all of a person's clients before deactivating them (Flow 2)"
      description: >
        Both brokers are notified.
      security: [{ crmBearer: [] }]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toBrokerUserId]
              properties:
                toBrokerUserId: { type: string, format: uuid }
      responses:
        '200':
          description: '{ reassigned }'

  /crm/public/document-requests/{token}:
    get:
      tags: [CRM]
      summary: 'Borrower link — what is still needed (no login)'
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: '{ firstName, missing, expiresAt }'
        '410':
          description: 'Expired — ask your broker for a new link'

  /crm/public/document-requests/{token}/files:
    post:
      tags: [CRM]
      summary: 'Borrower upload through the link (no login)'
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - {
            name: type,
            in: query,
            required: true,
            schema:
              {
                type: string,
                enum:
                  [
                    ID,
                    T4,
                    NOA,
                    PAY_STUB,
                    EMPLOYMENT_LETTER,
                    BANK_STATEMENT,
                    PURCHASE_AGREEMENT,
                    MORTGAGE_STATEMENT,
                    PROPERTY_TAX,
                    OTHER,
                  ],
              },
          }
        - { name: fileName, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: 'Received'
        '410':
          description: 'Expired'
        '422':
          description: 'Failed the virus check'

  /crm/public/bookings/{slug}:
    post:
      tags: [CRM]
      summary: 'Public booking page intake (Flow 4.8, no login)'
      description: >
        Same bookingRef twice → ignored. Email matches an existing person → appointment attached to them; otherwise a new lead for the page's default broker.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bookingRef, name, email, startTime, endTime]
              properties:
                bookingRef: { type: string }
                name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                title: { type: string }
                startTime: { type: string, format: date-time }
                endTime: { type: string, format: date-time }
      responses:
        '201':
          description: 'Booked'
        '200':
          description: 'Duplicate — ignored'
        '404':
          description: 'No such (enabled) booking page'

  /crm/internal/tenants/{tenantId}/profile-status:
    get:
      summary: 'Is the brokerage profile complete? (modules/auth Tenant Admin gate, Flow 0)'
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: '{ complete }'
          content:
            application/json:
              example: { success: true, data: { complete: false } }

  /crm/internal/brokers/{userId}/lead-count:
    get:
      tags: [Internal]
      summary: modules/auth calls this from the "Removing someone" deactivation check (SOW 2.11)
      description: >
        Internal — gated by X-Internal-Secret, not a JWT. "Do they still have
        clients assigned?" — every lead/client on this broker's book, Lost
        excluded.
      parameters:
        - name: X-Internal-Secret
          in: header
          required: true
          schema: { type: string }
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: tenantId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The count
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      count: { type: integer }
