      summary: Add a contact (SOW Module 14) — one of 7 fixed categories
      security: [{ crmBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, name]
              properties:
                category:
                  type: string
                  enum:
                    [
                      REALTOR,
                      LAWYER,
                      APPRAISER,
                      INSURANCE,
                      ACCOUNTANT,
                      HOME_INSPECTOR,
                      FINANCIAL_ADVISOR,
                    ]
                name: { type: string }
                company: { type: string }
                phone: { type: string }
                email: { type: string, format: email }
                dateOfBirth: { type: string, format: date-time }
                address: { type: string }
                city: { type: string }
                lastContactedAt: { type: string, format: date-time }
                notes: { type: string }
      responses:
        '201':
          description: Contact added
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Contact' }
