        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The calculation (or which fields are missing)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Affordability' }

  /crm/team/leads/{id}/reassign:
    patch:
      tags: [CRM — Team Lead]
      summary: Reassign a lead to another broker on the team
      description: The target broker must already be on the caller's team — otherwise 400 (not selectable).
      security: [{ crmBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toBrokerUserId]
              properties:
                toBrokerUserId: { type: string, format: uuid }
      responses:
        '200':
          description: Reassigned — recorded in the activity log
        '400':
          description: That broker is not on this team

  /crm/team/tasks:
    get:
      tags: [CRM — Team Lead]
      summary: Every task across the team's brokers
      security: [{ crmBearer: [] }]
      responses:
        '200':
          description: Team tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Task' }

  /crm/reports:
    get:
      tags: [Reports]
      summary: 'Pick one: renewals · AI usage · pipeline · team performance'
      description: >
        Tenant Admin scopes to every person in the brokerage by default
        (narrow with teamId or brokerId); Team Lead is always scoped to
        their own team (narrow with brokerId). ai-usage ignores both
        filters — Gen_USG tracks per tenant, not per broker.
      security: [{ crmBearer: [] }]
      parameters:
        - name: type
          in: query
          required: true
          schema: { type: string, enum: [pipeline, renewals, team-performance, ai-usage] }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: brokerId, in: query, schema: { type: string, format: uuid } }
        - name: teamId
          in: query
          description: Tenant Admin only.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Report data — an empty/zeroed result when nothing matches ("Nothing to show, try a wider range").
        '403':
          description: brokerId is outside the caller's scope, or a Team Lead has no team

  /crm/reports/export:
    get:
      tags: [Reports]
      summary: 'Export as a spreadsheet — the export itself is recorded'
      description: Same parameters as GET /crm/reports. Returns a CSV download.
      security: [{ crmBearer: [] }]
      parameters:
        - name: type
          in: query
          required: true
          schema: { type: string, enum: [pipeline, renewals, team-performance, ai-usage] }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: brokerId, in: query, schema: { type: string, format: uuid } }
        - { name: teamId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema: { type: string }

  /crm/tenant/profile:
    get:
      tags: [Tenant Admin]
      summary: Brokerage profile
      security: [{ crmBearer: [] }]
      responses:
        '200':
          description: The brokerage's profile (empty defaults if never set)
    patch:
      tags: [Tenant Admin]
      summary: Update the brokerage profile
      security: [{ crmBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string }
                supportEmail: { type: string, format: email }
                phone: { type: string }
                address: { type: string }
      responses:
        '200':
          description: Updated

  /crm/tenant/booking-settings:
    get:
      tags: [Tenant Admin]
      summary: Booking page setup
      description: Settings/config only — no public scheduling/availability engine behind this.
      security: [{ crmBearer: [] }]
      responses:
        '200':
          description: Current settings (disabled defaults if never set up)
    patch:
      tags: [Tenant Admin]
      summary: Update the booking page setup
      security: [{ crmBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                slug:
                  {
                    type: string,
                    example: acme-realty,
                    description: Lowercase letters,
                    numbers and hyphens only.,
                  }
                enabled: { type: boolean }
                bufferMinutes: { type: integer, minimum: 0, maximum: 240 }
      responses:
        '200':
          description: Updated
        '400':
          description: A slug is required on first setup
        '409':
          description: That slug is already taken by another brokerage

  /crm/tenant/book:
    get:
      tags: [Tenant Admin]
      summary: Every lead and client across the brokerage
      description: No team filter — every person in the tenant, not just one team.
      security: [{ crmBearer: [] }]
      responses:
        '200':
          description: Every lead in the tenant
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Lead' }

  /crm/tenant/export:
    post:
      tags: [Tenant Admin]
      summary: 'Export all our data — self-service, distinct from the Super Admin cancellation export'
      description: Packages the tenant's own leads/clients, their mortgages, and tasks.
      security: [{ crmBearer: [] }]
      responses:
        '201':
          description: Export job started
    get:
      tags: [Tenant Admin]
      summary: Latest export status
      security: [{ crmBearer: [] }]
      responses:
        '200':
          description: The latest export job, or null if none has been started

  /crm/tenant/export/{jobId}/download:
    get:
      tags: [Tenant Admin]
      summary: Download the export
      description: 403 if jobId isn't this tenant's current (latest) export.
      security: [{ crmBearer: [] }]
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The zip file
        '403':
          description: Not your brokerage's export
        '409':
          description: Export is not ready yet
        '410':
          description: Download window has expired

  /crm/integrations/google/connect:
    get:
      tags: [Google integration]
      summary: 'Connect email/calendar — the Google OAuth consent URL'
      description: Broker and Team Lead each connect their own Google account.
      security: [{ crmBearer: [] }]
      responses:
        '200':
          description: The URL to redirect the browser to
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: object, properties: { url: { type: string } } }

  /crm/integrations/google/callback:
    get:
      tags: [Google integration]
      summary: OAuth callback
      description: >
        Public — Google redirects the browser here directly with no JWT.
        `state` is the userId that started the connect flow.
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Connected
        '400':
          description: Unknown user for this connection attempt

  /crm/integrations/google/status:
    get:
      tags: [Google integration]
      summary: Is Google connected, and as which account?
      security: [{ crmBearer: [] }]
      responses:
        '200':
          description: '{ connected, googleEmail }'

  /crm/integrations/google:
    delete:
      tags: [Google integration]
      summary: Disconnect
      security: [{ crmBearer: [] }]
      responses:
        '204':
          description: Disconnected

  /crm/appointments:
    post:
      tags: [Google integration]
      summary: 'New appointment (Flow 4.8) — pushed to Google Calendar if connected, else CRM-only'
      security: [{ crmBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, startTime, endTime]
              properties:
                title: { type: string }
                startTime: { type: string, format: date-time }
                endTime: { type: string, format: date-time }
                leadId: { type: string, format: uuid }
                attendeeEmails: { type: array, items: { type: string, format: email } }
      responses:
        '201':
          description: Created — check pushedToGoogle to see whether it reached Calendar
    get:
      tags: [Google integration]
      summary: My appointments
      security: [{ crmBearer: [] }]
      responses:
        '200':
          description: The caller's appointments

  /crm/team/calendar:
    get:
      tags: [CRM — Team Lead]
      summary: Team calendar — every appointment across the team's brokers
      security: [{ crmBearer: [] }]
      responses:
        '200':
          description: Team appointments

  /crm/emails/send:
    post:
      tags: [Google integration]
      summary: 'Sending an email (Flow 4.7)'
