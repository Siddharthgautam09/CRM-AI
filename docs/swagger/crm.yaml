        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: brokerId, in: query, schema: { type: string, format: uuid } }
        - name: teamId
          in: query
          description: Tenant Admin only.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Report data — an empty/zeroed result when nothing matches ("Nothing to show, try a wider range").
        '403':
          description: brokerId is outside the caller's scope, or a Team Lead has no team

