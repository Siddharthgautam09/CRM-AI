components:
  securitySchemes:
    superAdminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        A SUPER_ADMIN access token from modules/auth's
        POST /api/v1/auth/super-admin/login (or /api/v1/modauth/login for a
        user_type=SUPER_ADMIN account).
  schemas:
    Brokerage:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, example: acme-realty }
        name: { type: string, example: Acme Realty }
        status: { type: string, enum: [PROVISIONING, ACTIVE, SUSPENDED, CANCELLED, PURGED] }
        region: { type: string, nullable: true }
        primaryOwnerUserId: { type: string, format: uuid }
        provisioningJobId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        onboardingStatus:
          type: string
          enum: [PENDING, ACTIVE]
          description: Separate from `status` — PENDING until the owner accepts their invite.
        invitationId: { type: string, format: uuid }
    CreateBrokerageRequest:
      type: object
      required: [name, ownerName, ownerEmail]
      properties:
        name: { type: string, minLength: 2, example: Acme Realty }
        ownerName: { type: string, example: Jordan Lee }
        ownerEmail: { type: string, format: email }
        region: { type: string, default: us-east-1 }
    ExportJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        status: { type: string, enum: [EXPORTING, READY, FAILED, EXPIRED, DELETED] }
        readyAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string }
    UsageStatus:
      type: object
      properties:
        metric: { type: string, example: ai_cost_daily }
        outcome: { type: string, enum: [ALLOW, SOFT_WARN_80, SOFT_WARN_95, GRACE, BLOCK] }
        paused:
          type: boolean
          description: "true once BLOCK — \"has this brokerage hit its daily cost limit?\""
        current: { type: number, example: 60 }
        limit: { type: number, example: 50 }
        pct: { type: number, example: 120 }
        overrideExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: Set while an "Allow extra for today" override is active.

paths:
  /platform/brokerages:
    post:
      tags: [Platform]
      summary: Create a brokerage
      description: >
        Checks the owner's email isn't already registered, creates the
        Gen_TNT tenant record, then sends the owner a TENANT_ADMIN invitation
        via modules/auth. Status stays PENDING (onboardingStatus) until they accept.
      security: [{ superAdminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBrokerageRequest' }
      responses:
        '201':
          description: Brokerage created, invitation sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Brokerage' }
        '409':
          description: That email already belongs to another account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      tags: [Platform]
      summary: List brokerages
      security: [{ superAdminBearer: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Paginated brokerages
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  total: { type: integer }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Brokerage' }

  /platform/brokerages/{id}:
    get:
      tags: [Platform]
      summary: Get a brokerage
      security: [{ superAdminBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The brokerage
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Brokerage' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /platform/brokerages/{id}/suspend:
    patch:
      tags: [Platform]
      summary: Suspend a brokerage
      description: Everyone in that brokerage is blocked at login until reactivated.
      security: [{ superAdminBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10 }
      responses:
        '200':
          description: Suspended
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Brokerage' }

  /platform/brokerages/{id}/reactivate:
    patch:
      tags: [Platform]
      summary: Reactivate a suspended brokerage
      security: [{ superAdminBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        '200':
          description: Reactivated — access restored
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Brokerage' }

  /platform/brokerages/{id}/cancel:
    patch:
      tags: [Platform]
      summary: Start cancellation
      description: >
        Marks the tenant CANCELLED in Gen_TNT and kicks off a data export
        (a downloadable zip). Data stays in the main platform after export;
        the export itself is permanently deleted after the retention window.
      security: [{ superAdminBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Cancellation started
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      tenant: { $ref: '#/components/schemas/Brokerage' }
                      exportJob: { $ref: '#/components/schemas/ExportJob' }

  /platform/brokerages/{id}/export:
    get:
      tags: [Platform]
      summary: Latest export job status for a brokerage
      security: [{ superAdminBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Export job status (or null if none started)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    oneOf:
                      - { $ref: '#/components/schemas/ExportJob' }
                      - { type: 'null' }

  /platform/exports/{jobId}/download:
    get:
      tags: [Platform]
      summary: Download a ready export
      description: 410 if the download window (BROKERAGE_EXPORT_DOWNLOAD_DAYS) has passed; 409 if not ready yet.
      security: [{ superAdminBearer: [] }]
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The zip file
          content:
            application/zip:
              schema: { type: string, format: binary }
        '409': { description: Export is not ready yet }
        '410': { description: Download window has expired }

  /platform/brokerages/{id}/usage:
    get:
      tags: [Platform]
      summary: "Watching AI cost — has this brokerage hit its daily cost limit?"
      description: Reads current status only (delta=0) — never records usage itself.
      security: [{ superAdminBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Current usage status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/UsageStatus' }

  /platform/brokerages/{id}/usage/allow-extra-today:
    post:
      tags: [Platform]
      summary: Allow extra for today
      description: >
        Raises today's limit until midnight UTC, then reverts on its own
        ("resets by itself tomorrow") — no separate "leave it paused" call
        needed, that's just not calling this endpoint. Takes up to 5 minutes
        to take effect (gen-usg-starter's own limit cache TTL) — see
        usage.service.ts's allowExtraToday doc comment.
      security: [{ superAdminBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Override active until end of day
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/UsageStatus' }

  /platform/brokerages/{id}/usage/simulate:
    post:
      tags: [Platform]
      summary: (Demo/test only) record simulated AI usage
      description: >
        Not part of the Super Admin flow diagrams — this repo has no real AI
        feature calling Gen_USG's increment() yet, so this is the only way to
        actually exercise the "AI paused" state end to end.
      security: [{ superAdminBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deltaUsdCents]
              properties:
                deltaUsdCents: { type: integer, example: 60 }
      responses:
        '200':
          description: Usage recorded, current status returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/UsageStatus' }

  /platform/webhooks/owner-accepted:
    post:
      tags: [Platform]
      summary: modules/auth calls this after a TENANT_ADMIN invite is accepted
      description: Internal — gated by X-Internal-Secret, not a JWT.
      parameters:
        - name: X-Internal-Secret
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId]
              properties:
                tenantId: { type: string, format: uuid }
      responses:
        '204': { description: Onboarding marked ACTIVE }
        '401': { description: Unauthorized }
