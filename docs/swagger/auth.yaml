paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Login with credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful
  /auth/refresh-token:
    post:
      tags: [Auth]
      summary: Refresh token pair
      responses:
        '200':
          description: Tokens refreshed
  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout and revoke refresh token
      responses:
        '204':
          description: Logged out
