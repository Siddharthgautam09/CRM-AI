paths:
  /documents:
    get:
      tags: [Documents]
      summary: List documents for the authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Documents fetched successfully
    post:
      tags: [Documents]
      summary: Create a document
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Document created successfully
  /documents/{id}:
    get:
      tags: [Documents]
      summary: Get document by ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Document fetched successfully
    patch:
      tags: [Documents]
      summary: Update document by ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Document updated successfully
    delete:
      tags: [Documents]
      summary: Delete document by ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Document deleted successfully
